spring.application.name=Scholarz
logging.level.org.springframework=DEBUG
logging.level.org.hibernate=DEBUG

# Spring Boot application properties
server.port=8080

# H2 Database configuration
spring.datasource.url=jdbc:h2:file:C:/Users/Admin/test;IFEXISTS=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT secret key (uncomment and set your secret key if using symmetric JWT)
# jwt.secret=your_secret_key_your_secret_key_123456

# JWT token expiration time (e.g., 1 day in milliseconds)
jwt.expirationMs=86400000
jwt.token.expiration=3600
# Path to your RSA keys (if using asymmetric JWT)
jwt.private.key.path=src/main/resources/private_key.der
jwt.public.key.path=src/main/resources/public_key.der

# JWT header configuration
jwt.header.name=Authorization
